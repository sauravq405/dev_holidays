<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Query Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container" role="main">
        <header>
            <h1>
                <svg viewBox="0 0 900 600" width="36" height="24" class="title-logo">
                    <rect width="900" height="600" fill="#f4c430" />
                    <rect width="900" height="400" y="200" fill="#fff" />
                    <rect width="900" height="200" y="400" fill="#046a38" />
                    <g transform="translate(450,300)">
                        <circle r="92.5" fill="none" stroke="#000080" stroke-width="5" />
                        <circle r="15" fill="#000080" />
                        <path
                            d="M0-92.5V92.5M46.25-80.1V80.1M80.1-46.25H-80.1M92.5 0H-92.5M80.1 46.25H-80.1M46.25 80.1V-80.1M0 92.5V-92.5M-46.25 80.1V-80.1M-80.1 46.25H80.1M-92.5 0H92.5M-80.1-46.25H80.1M-46.25-80.1V80.1"
                            stroke="#000080" stroke-width="2" />
                    </g>
                </svg>
                Holiday Query Explorer
            </h1>
            <p class="subtitle">Ask questions about official holidays in plain English</p>
        </header>

        <section class="input-card">
            <div class="input-group">
                <textarea id="questionInput" placeholder="e.g. Show public holidays in January 2026" rows="2"
                    aria-label="Your question about holidays"></textarea>
            </div>
            <div class="actions">
                <button id="askBtn" type="button">Ask Question</button>
            </div>
            <div id="errorMsg" class="error-message hidden" role="alert"></div>
        </section>

        <section id="loading" class="loading hidden" aria-live="polite">
            <div class="spinner"></div>
            <span>Fetching results...</span>
        </section>

        <section id="resultsArea" class="results-area hidden">
            <div class="sql-section">
                <h2 class="section-label">Generated SQL</h2>
                <pre><code id="sqlDisplay"></code></pre>
            </div>

            <div class="table-section">
                <div class="table-header-row">
                    <h2 class="section-label">Result Data</h2>
                    <span id="rowCount" class="row-count-badge">0 rows</span>
                </div>
                <div id="tableWrapper" class="table-wrapper">
                    <table id="resultsTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                    <div id="noResults" class="no-results hidden">No results found</div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
