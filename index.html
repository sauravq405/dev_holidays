<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Query Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>Holiday Query Explorer</h1>
            <p class="subtitle">Ask questions about official holidays in plain English</p>
        </header>

        <main>
            <div class="input-card">
                <div class="input-group">
                    <textarea id="questionInput" placeholder="e.g. Show public holidays in January 2026" rows="2"></textarea>
                </div>
                <div class="actions">
                    <button id="askBtn">Ask Question</button>
                </div>
                <div id="errorMsg" class="error-message hidden"></div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <span>Fetching results...</span>
            </div>

            <div id="resultsArea" class="results-area hidden">
                <div class="sql-section">
                    <div class="section-label">Generated SQL</div>
                    <pre><code id="sqlDisplay"></code></pre>
                </div>

                <div class="table-section">
                    <div class="table-header-row">
                        <div class="section-label">Result Data</div>
                        <span id="rowCount" class="row-count-badge">0 rows</span>
                    </div>
                    <div class="table-wrapper">
                        <table id="resultsTable">
                            <thead>
                                <!-- Dynamic headers -->
                            </thead>
                            <tbody>
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                        <div id="noResults" class="no-results hidden">No results found</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
