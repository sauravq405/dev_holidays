<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Query Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container" role="main">
        <header>
            <h1>Holiday Query Explorer</h1>
            <p class="subtitle">Ask questions about official holidays in plain English</p>
        </header>

        <section class="input-card">
            <div class="input-group">
                <textarea id="questionInput" placeholder="e.g. Show public holidays in January 2026" rows="2"
                    aria-label="Your question about holidays"></textarea>
            </div>
            <div class="actions">
                <button id="askBtn" type="button">Ask Question</button>
            </div>
            <div id="errorMsg" class="error-message hidden" role="alert"></div>
        </section>

        <section id="loading" class="loading hidden" aria-live="polite">
            <div class="spinner"></div>
            <span>Fetching results...</span>
        </section>

        <section id="resultsArea" class="results-area hidden">
            <div class="sql-section">
                <h2 class="section-label">Generated SQL</h2>
                <pre><code id="sqlDisplay"></code></pre>
            </div>

            <div class="table-section">
                <div class="table-header-row">
                    <h2 class="section-label">Result Data</h2>
                    <span id="rowCount" class="row-count-badge">0 rows</span>
                </div>
                <div id="tableWrapper" class="table-wrapper">
                    <table id="resultsTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                    <div id="noResults" class="no-results hidden">No results found</div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
